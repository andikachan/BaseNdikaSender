name: flutter_sender_app
description: "A Cyberpunk-themed WhatsApp Bot Management Dashboard built with Flutter & Dart"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

  fonts:
    - family: Astral
      fonts:
        - asset: fonts/Astral.ttf
    - family: Orbitron
      fonts:
        - asset: fonts/Astral.ttf
